    <script>
      window.__CRATEMIND_READY__ = false;
      window.__resetPocketCache = async function () {
        try {
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            for (const r of regs) await r.unregister();
          }
          if ('caches' in window) {
            const keys = await caches.keys();
            for (const k of keys) await caches.delete(k);
          }
        } catch (e) {}
        window.location.reload();
      };
      setTimeout(function () {
        if (!window.__CRATEMIND_READY__) {
          var el = document.getElementById('boot-watchdog');
          if (el) {
            el.style.display = 'block';
            el.innerHTML =
              '<p style="color:#f87171;font-size:12px;margin-bottom:12px;">BOOT TIMEOUT: OFFLINE SHELL LOCKED</p>' +
              '<button onclick="window.location.reload()" style="background:#27272a;color:#fff;border:1px solid #3f3f46;padding:8px 14px;border-radius:6px;margin-right:8px;font-size:12px;cursor:pointer;">Reload Shell</button>' +
              '<button onclick="window.__resetPocketCache()" style="background:#7f1d1d;color:#fff;border:1px solid #991b1b;padding:8px 14px;border-radius:6px;font-size:12px;cursor:pointer;">Reset SW Cache</button>';
          }
        }
      }, 3500);
    </script>
